name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

# Cancel an in-progress run when a newer one starts for the same ref+event,
# so pushes don't pile up stale runs competing for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: v2.0.25

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4)
        with:
          persist-credentials: false

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Generate keypair
        run: solana-keygen new --no-bip39-passphrase

      - name: Install protobuf compiler (solana-program-test build dep)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build program
        run: cargo build-sbf --workspace

      - name: Run Rust tests (unit + legacy-migration integration)
        run: cargo test -p chiefstaker

      - name: Start test validator with upgradeable program
        run: |
          solana config set --url http://localhost:8899 --keypair ~/.config/solana/id.json
          solana-test-validator \
            --ledger test-ledger \
            --rpc-port 8899 \
            --faucet-port 9900 \
            --slots-per-epoch 32 \
            --upgradeable-program 3Ecf8gyRURyrBtGHS1XAVXyQik5PqgDch4VkxrH4ECcr target/deploy/chiefstaker.so ~/.config/solana/id.json \
            --log &
          sleep 5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4)
        with:
          node-version: 20

      - name: Install test dependencies
        run: cd tests/typescript && npm ci

      - name: Run E2E tests
        run: cd tests/typescript && npm test

  verifiable-build:
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4)
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install solana-verify
        run: cargo install solana-verify --version 0.4.11 --locked

      - name: Build verifiable binary
        run: solana-verify build --library-name chiefstaker

      - name: Print executable hash
        run: solana-verify get-executable-hash target/deploy/chiefstaker.so

      # Never publish the deployable artifact for pull_request runs: PR code
      # is unreviewed (and may come from a fork), and scripts/deploy-program.sh
      # downloads this artifact by name.
      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4)
        with:
          name: chiefstaker-verifiable
          path: target/deploy/chiefstaker.so
          retention-days: 90
